<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndusTech - Plataforma Industrial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #1e293b; margin-bottom: 8px; font-size: 28px; }
        p { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        #message { margin-top: 16px; font-size: 14px; font-weight: 600; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
        .dashboard { display: none; margin-top: 20px; padding: 20px; background-color: #f1f5f9; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card" id="loginCard">
        <h1>IndusTech</h1>
        <p>Acesse o painel de controle industrial</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="admin@industech.com" value="admin@industech.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" value="admin123" required>
            </div>
            <button type="submit" id="btnSubmit">Entrar na Plataforma</button>
        </form>

        <div id="message"></div>

        <div id="dashboard" class="dashboard">
            <h2>Bem-vindo!</h2>
            <p>Acesso liberado com sucesso ao sistema IndusTech.</p>
        </div>
    </div>

    <script>
        const API = 'https://industech-api.onrender.com/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const btnSubmit = document.getElementById('btnSubmit');
            const dashboardDiv = document.getElementById('dashboard');
            
            messageDiv.className = '';
            messageDiv.innerText = 'Conectando à plataforma...';
            btnSubmit.disabled = true;

            try {
                const response = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = 'success';
                    messageDiv.innerText = data.message;
                    document.getElementById('loginForm').style.display = 'none';
                    dashboardDiv.style.display = 'block';
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerText = data.message || 'Erro ao realizar login.';
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Servidor despertando... Tente clicar novamente em alguns segundos.';
            } finally {
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
